<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#f5f7fb">
  <title>Send to DropLink</title>
  <style>
    *{box-sizing:border-box}body{font-family:Segoe UI,Arial,sans-serif;background:#f5f7fb;color:#172033;margin:0}
    main{max-width:560px;margin:32px auto;padding:16px}.card{background:#fff;border-radius:18px;padding:24px;box-shadow:0 8px 30px #0001}
    h1{margin:0 0 8px}.muted{color:#697386;line-height:1.5}.picker{display:block;width:100%;margin:24px 0;padding:14px;border:1px dashed #9aa7ba;border-radius:12px;background:#fafbfe}
    button{width:100%;border:0;border-radius:12px;padding:14px;background:#1d6ff2;color:white;font-size:16px;font-weight:600}
    button:disabled{opacity:.5}progress{width:100%;height:16px;margin-top:20px}#result{margin-top:14px;white-space:pre-wrap;line-height:1.5}
  </style>
</head>
<body>
  <main><section class="card">
    <h1>Send to DropLink</h1>
    <div class="muted">Choose one or more files to send to this computer. Files are encrypted before they are stored.</div>
    <input class="picker" id="files" type="file" multiple>
    <button id="upload" disabled>Send files</button>
    <progress id="progress" value="0" max="100" hidden></progress>
    <div id="result" class="muted" aria-live="polite"></div>
  </section></main>
  <script>
    const picker = document.getElementById('files');
    const button = document.getElementById('upload');
    const progress = document.getElementById('progress');
    const result = document.getElementById('result');
    picker.addEventListener('change', () => {
      button.disabled = picker.files.length === 0;
      result.textContent = picker.files.length ? `${picker.files.length} file(s) selected.` : '';
    });

    function uploadFile(file) {
      return new Promise((resolve, reject) => {
        const form = new FormData();
        form.append('file', file, file.name);
        const request = new XMLHttpRequest();
        request.open('POST', '/api/upload');
        request.onload = () => request.status >= 200 && request.status < 300
          ? resolve()
          : reject(new Error(`${file.name}: upload failed (${request.status})`));
        request.onerror = () => reject(new Error(`${file.name}: connection failed`));
        request.send(form);
      });
    }

    button.addEventListener('click', async () => {
      const files = Array.from(picker.files);
      if (!files.length) return;
      button.disabled = true;
      picker.disabled = true;
      progress.hidden = false;
      progress.value = 0;
      const completed = [];
      const failed = [];
      for (const file of files) {
        result.textContent = `Sending ${file.name}…`;
        try { await uploadFile(file); completed.push(file.name); }
        catch (error) { failed.push(error.message); }
        progress.value = (completed.length + failed.length) / files.length * 100;
      }
      result.textContent = `${completed.length} of ${files.length} file(s) sent.` +
        (failed.length ? `\n${failed.join('\n')}` : '');
      picker.disabled = false;
      button.disabled = picker.files.length === 0;
    });
  </script>
</body>
</html>
